name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build-and-upload:
    name: Build iOS and Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'

      - name: Decode ASC key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8

      - name: Install bundler and fastlane
        run: |
          gem install bundler
          bundle install || true

      - name: Prepare env
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          PROV_PROFILE_NAME: ${{ secrets.PROV_PROFILE_NAME }}
        run: |
          export ASC_KEY_PATH=/tmp/AuthKey.p8

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /tmp/AuthKey.p8
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          PROV_PROFILE_NAME: ${{ secrets.PROV_PROFILE_NAME }}
        run: |
          cd frontend/ios
          bundle exec fastlane beta
