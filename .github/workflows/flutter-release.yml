name: iOS Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    name: Build iOS and Upload to App Store Connect
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'

      - name: Decode ASC key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8

      - name: Install bundler and fastlane
        run: |
          gem install bundler
          cd frontend/ios
          bundle install

      - name: Build and upload production release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /tmp/AuthKey.p8
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          PROV_PROFILE_NAME: ${{ secrets.PROV_PROFILE_NAME }}
        run: |
          cd frontend/ios
          bundle exec fastlane production
