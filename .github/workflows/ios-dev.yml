name: iOS Dev Validation

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate iOS development build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'

      - name: Create placeholder MapTiler asset
        # frontend/pubspec.yaml declares .env.local.json as an asset, but the file
        # is gitignored (it holds a real MapTiler key), so CI never has it and the
        # asset bundle fails to build. MapConfig.init() already tolerates an empty
        # file and --dart-define overrides it, so a stub is enough here.
        run: echo '{}' > frontend/.env.local.json

      - name: Install bundler and fastlane
        run: |
          gem install bundler
          cd frontend/ios
          bundle install

      - name: Run dev lane
        run: |
          cd frontend/ios
          bundle exec fastlane dev