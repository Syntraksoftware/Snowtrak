name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend/main-backend
          pip install -r requirements.txt -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          cd backend/main-backend
          pytest --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/main-backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
      
      - name: Create placeholder MapTiler asset
        # frontend/pubspec.yaml declares .env.local.json as an asset, but the file
        # is gitignored (it holds a real MapTiler key), so CI never has it and the
        # asset bundle fails to build. MapConfig.init() already tolerates an empty
        # file and --dart-define overrides it, so a stub is enough here.
        run: echo '{}' > frontend/.env.local.json

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      
      - name: Analyze
        # analysis_options.yaml turns on unawaited_futures, close_sinks,
        # cancel_subscriptions and friends. They were honour-system until now:
        # only flutter test was gated, so a green PR proved nothing about them.
        #
        # dart analyze, not flutter analyze: on 3.38.6 -- the version pinned
        # above -- flutter analyze crashes with "analysis server exited with
        # code 64". Same analyzer, same analysis_options.yaml, and it exits
        # non-zero on any issue including lints, so this gate is strict.
        run: |
          cd frontend
          dart analyze
        timeout-minutes: 10

      - name: Run tests with coverage
        run: |
          cd frontend
          flutter test --coverage
        continue-on-error: false
        timeout-minutes: 10
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage


