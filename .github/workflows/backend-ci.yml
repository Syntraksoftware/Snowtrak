name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Every step here used to end in `|| true`, so all four jobs reported success
# whatever happened -- they were green through months in which the rest of CI
# was red. The suites they run do pass; they simply were not gating anything.

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # map-backend has no tests/ directory of its own; its code is covered by
        # the shared suite below, which imports from it.
        service: [main-backend, community-backend, activity-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Each service's own requirements, not backend/requirements.txt. The
      # unified file uses >= ranges and resolves to different versions than the
      # pinned ones that ship in the image, so testing against it tested
      # something other than production. The four files also cannot share one
      # environment -- supabase wants httpx<0.28 while map-backend pins 0.28.1.
      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "backend/${{ matrix.service }}"
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          else
            pip install pytest pytest-asyncio
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          cd "backend/${{ matrix.service }}"
          python -m pytest -q tests
        env:
          PYTHONPATH: .:..

  shared-tests:
    name: Test (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # backend/tests holds 31 tests covering map-backend, the activities
      # domain, and two architectural guards -- the ports/adapters layering
      # check and the route-handler dependency check. No job ran them, so both
      # guards were dead the whole time they existed. They need map-backend's
      # dependencies; conftest.py puts the paths on sys.path itself.
      - name: Install map-backend dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r backend/map-backend/requirements.txt pytest pytest-asyncio

      - name: Run shared tests
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned: an unpinned linter turns a new release into a red build on a
      # branch that changed nothing.
      - name: Install ruff
        run: pip install ruff==0.16.3

      # The whole tree, not per service. Running it per service left
      # backend/tests, backend/shared and backend/scripts unlinted -- 38
      # violations that no job would ever have reported.
      - name: Run ruff
        run: ruff check backend
