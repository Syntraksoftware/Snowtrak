# Tags used by the suite. Declaring them here also silences the analyzer's
# "a tag was used that wasn't specified" warning.
tags:
  preview:
    # design_preview_test.dart renders the Home tab against a checked-in PNG so
    # the design can be eyeballed. Goldens are platform-dependent -- the golden
    # is generated on macOS, CI runs ubuntu, and the two rasterise text
    # differently -- so CI runs with `--exclude-tags preview`.
    #
    # It is a preview, not a regression gate. Regenerate after a deliberate
    # design change:
    #   flutter test --update-goldens test/design_preview_test.dart
