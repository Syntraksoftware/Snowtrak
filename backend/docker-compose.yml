# Every published port below binds to 127.0.0.1 on purpose. A bare "8080:8080"
# publishes on 0.0.0.0, and Docker writes its own iptables rules ahead of ufw, so
# a host firewall does not undo it. This file was found serving production with
# Redis and all four APIs reachable from the public internet; loopback binding is
# the fix that survives a misconfigured firewall. Caddy runs on the host and
# reverse-proxies to these ports, so nothing here needs an external address.
#
# Backends reach Redis as redis://redis:6379/0 over the Compose network, which
# does not involve the published port at all -- 6379 is published only so a
# developer can run redis-cli against it locally.
services:
  redis:
    # No requirepass: reachable only over the Compose network and loopback.
    # If this ever needs a non-loopback binding, set a password first.
    image: redis:7-alpine
    container_name: snowtrak-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  main-backend:
    build:
      context: .
      dockerfile: ./main-backend/Dockerfile
    env_file:
      - ./main-backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8080
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
      - WEATHER_CACHE_REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  community-backend:
    build:
      context: .
      dockerfile: ./community-backend/Dockerfile
    env_file:
      - ./community-backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FASTAPI_ENV=production
      - HOST=0.0.0.0
      - PORT=5001
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - redis
    restart: unless-stopped

  activity-backend:
    build:
      context: .
      dockerfile: ./activity-backend/Dockerfile
    env_file:
      - ./activity-backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FASTAPI_ENV=production
      - HOST=0.0.0.0
      - PORT=5100
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:5100:5100"
    depends_on:
      - redis
    restart: unless-stopped

  map-backend:
    build:
      context: .
      dockerfile: ./map-backend/Dockerfile
    container_name: snowtrak-map-backend
    env_file:
      - ./map-backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FASTAPI_ENV=production
      - HOST=0.0.0.0
      - PORT=5200
      - MAP_STORAGE_BACKEND=${MAP_STORAGE_BACKEND:-supabase}
      - POSTGIS_HOST=postgis
      - POSTGIS_PORT=5432
      - POSTGIS_DB=${POSTGRES_DB:-syntrak}
      - POSTGIS_USER=${POSTGRES_USER:-syntrak}
      - POSTGIS_PASSWORD=${POSTGRES_PASSWORD:-syntrak_local_dev}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:5200:5200"
    depends_on:
      - redis
    restart: unless-stopped

  # Optional local Postgres+PostGIS for offline dev. Production geo data lives on Supabase (Postgres + PostGIS).
  postgis:
    image: postgis/postgis:16-3.4
    profiles: ["postgis"]
    env_file:
      - ./postgres.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgis_data:
