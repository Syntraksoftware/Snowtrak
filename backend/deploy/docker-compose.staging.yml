services:
  # Not published on any host port: the backends reach it as redis://redis:6379/0
  # over the Compose network. It has no password, so it must never be published.
  # appendonly keeps the activity-pipeline stream across restarts -- without it a
  # container restart silently drops whatever was still in flight.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  main-backend:
    build:
      context: ../
      dockerfile: ./main-backend/Dockerfile
    env_file:
      - ./env/staging.env
    environment:
      PYTHONUNBUFFERED: "1"
      FASTAPI_ENV: staging
      HOST: 0.0.0.0
      PORT: 8080
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      WEATHER_CACHE_REDIS_URL: redis://redis:6379/0
      # Pinned here, not left to the merged env file. Compose's environment
      # block wins over env_file, so a single RATE_LIMIT_NAMESPACE accidentally
      # merged into <env>.env cannot collapse all four services onto one
      # shared rate-limit counter.
      RATE_LIMIT_NAMESPACE: main-backend
      WEATHER_CACHE_NAMESPACE: main-backend
    ports:
      - "127.0.0.1:15080:8080"
    restart: unless-stopped
    depends_on:
      - redis

  community-backend:
    build:
      context: ../
      dockerfile: ./community-backend/Dockerfile
    env_file:
      - ./env/staging.env
    environment:
      PYTHONUNBUFFERED: "1"
      FASTAPI_ENV: staging
      HOST: 0.0.0.0
      PORT: 5001
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      # Pinned here, not left to the merged env file. Compose's environment
      # block wins over env_file, so a single RATE_LIMIT_NAMESPACE accidentally
      # merged into <env>.env cannot collapse all four services onto one
      # shared rate-limit counter.
      RATE_LIMIT_NAMESPACE: community-backend
      CACHE_NAMESPACE: community-backend-cache
    ports:
      - "127.0.0.1:15001:5001"
    restart: unless-stopped
    depends_on:
      - redis

  activity-backend:
    build:
      context: ../
      dockerfile: ./activity-backend/Dockerfile
    env_file:
      - ./env/staging.env
    environment:
      PYTHONUNBUFFERED: "1"
      FASTAPI_ENV: staging
      HOST: 0.0.0.0
      PORT: 5100
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      # Pinned here, not left to the merged env file. Compose's environment
      # block wins over env_file, so a single RATE_LIMIT_NAMESPACE accidentally
      # merged into <env>.env cannot collapse all four services onto one
      # shared rate-limit counter.
      RATE_LIMIT_NAMESPACE: activity-backend
    ports:
      - "127.0.0.1:15100:5100"
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
